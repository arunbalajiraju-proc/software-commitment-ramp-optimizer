[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "software-commitment-ramp-optimizer"
version = "0.1.0"
description = "Risk-adjusted software licence commitment and deployment-ramp decision support."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Arun Balaji Raju" }
]
keywords = [
  "procurement",
  "strategic-sourcing",
  "software-licensing",
  "monte-carlo",
  "decision-support"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12"
]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<4",
  "plotly>=5.24,<7",
  "streamlit>=1.55,<2"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.9,<1"
]
publication = [
  "matplotlib>=3.8,<4"
]

[project.scripts]
commitment-optimizer = "commitment_optimizer.cli:main"

[project.urls]
Repository = "https://github.com/arunbalajiraju-proc/software-commitment-ramp-optimizer"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
